name: ELYSION Base Runtime Canary
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/elysion-base-runtime-canary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qwen3_4b:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HOME: /tmp/hf-qwen
      MODEL_ID: Qwen/Qwen3-4B
      MODEL_REVISION: 1cfa9a7208912126459214e8b04321603b3df60c
    steps:
      - uses: actions/checkout@v4
      - name: Install CPU runtime
        run: |
          python -m pip install --quiet --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet --no-cache-dir "transformers>=4.53,<5" accelerate safetensors huggingface_hub
      - name: Exact revision inference canary
        run: |
          mkdir -p receipts/runtime
          python - <<'PY'
          import os,json,hashlib,time,resource
          import torch
          from huggingface_hub import HfApi
          from transformers import AutoTokenizer,AutoModelForCausalLM
          mid=os.environ["MODEL_ID"]; rev=os.environ["MODEL_REVISION"]
          info=HfApi().model_info(mid,revision=rev)
          if info.sha != rev: raise SystemExit("REVISION_MISMATCH")
          t=time.time()
          tok=AutoTokenizer.from_pretrained(mid,revision=rev)
          model=AutoModelForCausalLM.from_pretrained(mid,revision=rev,torch_dtype=torch.bfloat16,low_cpu_mem_usage=True)
          msgs=[{"role":"user","content":"Return a short answer containing exactly the token CEREBRON_CANARY_OK."}]
          text=tok.apply_chat_template(msgs,tokenize=False,add_generation_prompt=True)
          inputs=tok(text,return_tensors="pt")
          with torch.inference_mode():
              out=model.generate(**inputs,max_new_tokens=16,do_sample=False)
          new=out[0][inputs["input_ids"].shape[-1]:]
          answer=tok.decode(new,skip_special_tokens=True)
          rec={
            "schema":"ELYSION_RUNTIME_CANARY_V1","status":"PASS","model_id":mid,
            "requested_revision":rev,"resolved_revision":info.sha,
            "device":"cpu","dtype":"bfloat16","output":answer,
            "output_sha256":hashlib.sha256(answer.encode()).hexdigest(),
            "latency_s":round(time.time()-t,3),
            "max_rss_kb":resource.getrusage(resource.RUSAGE_SELF).ru_maxrss
          }
          open("receipts/runtime/qwen3-4b.json","w").write(json.dumps(rec,indent=2)+"\n")
          print(json.dumps(rec))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: elysion-runtime-qwen3-4b
          path: receipts/runtime/qwen3-4b.json
          if-no-files-found: error

  smollm3_3b:
